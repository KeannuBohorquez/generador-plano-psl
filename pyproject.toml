[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.backends.legacy:build"

[project]
name            = "generador-plano-psl"
version         = "1.0.0"
description     = "Generador de archivo plano PSL para conciliacion bancaria BanColombia — P.A. Toledana del Sur"
requires-python = ">=3.10"
dependencies = [
    "pdfplumber>=0.10.0",
    "msoffcrypto-tool>=5.0.0",
    "openpyxl>=3.1.0",
    "xlrd>=2.0.1",
    "pandas>=2.0.0",
]

[project.scripts]
generador-plano = "generador_plano.ui.app:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-dir]
"" = "src"
